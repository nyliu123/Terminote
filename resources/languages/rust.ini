[language]
extensions = rs
line_comment = //
block_comment_start = /*
block_comment_end = */

[colors]
comment = GREEN
string = BRIGHT_RED
number = BRIGHT_GREEN
variable = BRIGHT_BLUE
function = BRIGHT_BLUE

[keywords.control_flow]
color = BRIGHT_MAGENTA
words = break,continue,else,for,if,in,loop,match,return,while

[keywords.declarations]
color = BRIGHT_MAGENTA
words = const,enum,fn,impl,let,static,struct,type

[keywords.ownership]
color = BRIGHT_MAGENTA
words = move,mut,ref

[keywords.modules_and_visibility]
color = BRIGHT_BLUE
words = crate,extern,mod,pub,self,super,use

[keywords.traits_and_generics]
color = BRIGHT_CYAN
words = as,dyn,trait,where

[keywords.async]
color = BRIGHT_MAGENTA
words = async,await

[keywords.safety]
color = BRIGHT_MAGENTA
words = unsafe

[keywords.types]
color = BRIGHT_CYAN
words = bool,char,f32,f64,i8,i16,i32,i64,i128,isize,str,u8,u16,u32,u64,u128,usize,String,Vec,VecDeque,HashMap,HashSet,Box,Rc,Arc,Cell,RefCell,Option,Result,Some,None,Ok,Err

[keywords.constants]
color = BRIGHT_GREEN
words = false,Self,true

[keywords.macros]
color = BRIGHT_BLUE
words = assert!,assert_eq!,assert_ne!,cfg!,compile_error!,concat!,dbg!,debug_assert!,debug_assert_eq!,env!,eprint!,eprintln!,format!,format_args!,include!,include_bytes!,include_str!,matches!,module_path!,option_env!,panic!,print!,println!,stringify!,todo!,unimplemented!,unreachable!,vec!,write!,writeln!

[keywords.reserved]
color = BRIGHT_MAGENTA
words = abstract,become,box,do,final,macro,override,priv,try,typeof,unsized,virtual,yield
