[language]
extensions = js,mjs,cjs,jsx
line_comment = //
block_comment_start = /*
block_comment_end = */
multiline_strings = `

[colors]
comment = GREEN
string = BRIGHT_RED
number = BRIGHT_GREEN
variable = BRIGHT_BLUE
function = BRIGHT_BLUE

[keywords.control_flow]
color = BRIGHT_MAGENTA
words = break,case,continue,default,do,else,for,if,of,return,switch,while,with,yield

[keywords.declarations]
color = BRIGHT_MAGENTA
words = class,const,function,let,var

[keywords.modules]
color = BRIGHT_BLUE
words = as,export,from,import

[keywords.async]
color = BRIGHT_MAGENTA
words = async,await

[keywords.exceptions]
color = BRIGHT_MAGENTA
words = catch,finally,throw,try

[keywords.operators]
color = BRIGHT_MAGENTA
words = delete,in,instanceof,new,typeof,void

[keywords.class_members]
color = BRIGHT_MAGENTA
words = extends,get,set,static,super,this

[keywords.reserved]
color = BRIGHT_MAGENTA
words = debugger,enum,implements,interface,package,private,protected,public

[keywords.constants]
color = BRIGHT_GREEN
words = false,Infinity,NaN,null,true,undefined

[keywords.builtins]
color = BRIGHT_YELLOW
words = AggregateError,Array,ArrayBuffer,Atomics,BigInt,BigInt64Array,BigUint64Array,Boolean,DataView,Date,Error,EvalError,FinalizationRegistry,Float32Array,Float64Array,Function,Int8Array,Int16Array,Int32Array,Intl,JSON,Map,Math,Number,Object,Promise,Proxy,RangeError,ReferenceError,Reflect,RegExp,Set,SharedArrayBuffer,String,Symbol,SyntaxError,TypeError,Uint8Array,Uint8ClampedArray,Uint16Array,Uint32Array,URIError,WeakMap,WeakRef,WeakSet,WebAssembly,console,decodeURI,decodeURIComponent,encodeURI,encodeURIComponent,eval,fetch,isFinite,isNaN,parseFloat,parseInt,queueMicrotask,setInterval,setTimeout,structuredClone
