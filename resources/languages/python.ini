[language]
extensions = py,pyw
line_comment = #
multiline_strings = """,'''

[colors]
comment = GREEN
string = BRIGHT_RED
number = BRIGHT_GREEN
variable = BRIGHT_BLUE
function = BRIGHT_BLUE

[keywords.control_flow]
color = BRIGHT_MAGENTA
words = break,case,continue,elif,else,for,if,match,pass,return,while,yield

[keywords.declarations]
color = BRIGHT_MAGENTA
words = class,def,global,lambda,nonlocal,type

[keywords.imports]
color = BRIGHT_BLUE
words = as,from,import

[keywords.exceptions]
color = BRIGHT_MAGENTA
words = assert,except,finally,raise,try

[keywords.async]
color = BRIGHT_MAGENTA
words = async,await

[keywords.operators_and_context]
color = BRIGHT_MAGENTA
words = and,del,in,is,not,or,with

[keywords.constants]
color = BRIGHT_GREEN
words = Ellipsis,False,None,NotImplemented,True,__debug__

[keywords.builtins]
color = BRIGHT_YELLOW
words = abs,aiter,all,anext,any,ascii,bin,bool,breakpoint,bytearray,bytes,callable,chr,classmethod,@classmethod,compile,complex,dict,dir,divmod,enumerate,eval,exec,filter,float,format,frozenset,getattr,globals,hasattr,hash,help,hex,id,input,int,isinstance,issubclass,iter,len,list,locals,map,max,memoryview,min,next,object,oct,open,ord,pow,print,property,@property,range,repr,reversed,round,set,setattr,slice,sorted,staticmethod,@staticmethod,str,sum,super,tuple,vars,zip,__import__
