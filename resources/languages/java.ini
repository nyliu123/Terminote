[language]
extensions = java
line_comment = //
block_comment_start = /*
block_comment_end = */
multiline_strings = """

[colors]
comment = GREEN
string = BRIGHT_RED
number = BRIGHT_GREEN
variable = BRIGHT_BLUE
function = BRIGHT_BLUE

[keywords.control_flow]
color = BRIGHT_MAGENTA
words = break,case,continue,default,do,else,for,if,return,switch,while,yield

[keywords.declarations]
color = BRIGHT_MAGENTA
words = class,enum,extends,implements,interface,record,var

[keywords.access_and_modifiers]
color = BRIGHT_MAGENTA
words = abstract,final,native,private,protected,public,sealed,static,strictfp,synchronized,transient,volatile,non-sealed,permits

[keywords.types]
color = BRIGHT_CYAN
words = boolean,byte,char,double,float,int,long,short,void,String,Object,Class,Integer,Long,Double,Float,Character,Boolean,Byte,Short,BigInteger,BigDecimal,List,ArrayList,LinkedList,Map,HashMap,Set,HashSet,Optional,Stream

[keywords.objects]
color = BRIGHT_MAGENTA
words = instanceof,new,super,this

[keywords.exceptions]
color = BRIGHT_MAGENTA
words = assert,catch,finally,throw,throws,try

[keywords.packages_and_modules]
color = BRIGHT_BLUE
words = exports,import,module,open,opens,package,provides,requires,to,transitive,uses,with

[keywords.constants]
color = BRIGHT_GREEN
words = false,null,true

[keywords.annotations]
color = BRIGHT_BLUE
words = @Deprecated,@FunctionalInterface,@Override,@SafeVarargs,@SuppressWarnings,@Retention,@Target,@Documented,@Inherited,@Repeatable

[keywords.reserved]
color = BRIGHT_MAGENTA
words = const,goto

[keywords.common_methods]
color = BRIGHT_YELLOW
words = equals,getClass,hashCode,length,main,of,println,printf,size,stream,toString,valueOf
