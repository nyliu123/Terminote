[language]
extensions = c,h
line_comment = //
block_comment_start = /*
block_comment_end = */

[colors]
comment = GREEN
string = BRIGHT_RED
number = BRIGHT_GREEN
variable = BRIGHT_BLUE
function = BRIGHT_BLUE

[keywords.control_flow]
color = BRIGHT_MAGENTA
words = break,case,continue,default,do,else,for,goto,if,return,switch,while

[keywords.declarations]
color = BRIGHT_MAGENTA
words = constexpr,enum,extern,inline,static,struct,typedef,union,_Noreturn,_Static_assert,static_assert,thread_local

[keywords.storage_and_qualifiers]
color = BRIGHT_MAGENTA
words = auto,const,register,restrict,volatile,_Atomic,_Thread_local

[keywords.types]
color = BRIGHT_CYAN
words = bool,char,double,float,int,long,short,signed,unsigned,void,_BitInt,_Bool,_Complex,_Decimal32,_Decimal64,_Decimal128,_Imaginary,size_t,ssize_t,ptrdiff_t,int8_t,int16_t,int32_t,int64_t,uint8_t,uint16_t,uint32_t,uint64_t,intptr_t,uintptr_t,FILE

[keywords.operators]
color = BRIGHT_MAGENTA
words = alignas,alignof,sizeof,typeof,typeof_unqual,_Alignas,_Alignof,_Generic

[keywords.preprocessor]
color = BRIGHT_BLUE
words = #define,defined,#elif,#else,#endif,#error,#if,#ifdef,#ifndef,#include,#include_next,#line,#pragma,#undef,#warning

[keywords.constants]
color = BRIGHT_GREEN
words = NULL,false,nullptr,true,EOF,EXIT_SUCCESS,EXIT_FAILURE

[keywords.standard_library]
color = BRIGHT_YELLOW
words = calloc,exit,fclose,fflush,fopen,fprintf,fread,free,fscanf,fseek,ftell,fwrite,malloc,memcmp,memcpy,memmove,memset,printf,realloc,scanf,snprintf,sprintf,strcat,strchr,strcmp,strcpy,strlen,strncmp,strncpy,strrchr,strstr
