[language]
extensions = go
line_comment = //
block_comment_start = /*
block_comment_end = */
multiline_strings = `

[colors]
comment = GREEN
string = BRIGHT_RED
number = BRIGHT_GREEN
variable = BRIGHT_BLUE
function = BRIGHT_BLUE

[keywords.control_flow]
color = BRIGHT_MAGENTA
words = break,case,continue,default,else,fallthrough,for,goto,if,range,return,select,switch

[keywords.declarations]
color = BRIGHT_MAGENTA
words = const,func,interface,map,struct,type,var

[keywords.packages]
color = BRIGHT_BLUE
words = import,package

[keywords.concurrency]
color = BRIGHT_MAGENTA
words = chan,defer,go

[keywords.types]
color = BRIGHT_CYAN
words = any,bool,byte,comparable,complex64,complex128,error,float32,float64,int,int8,int16,int32,int64,rune,string,uint,uint8,uint16,uint32,uint64,uintptr

[keywords.constants]
color = BRIGHT_GREEN
words = false,iota,nil,true

[keywords.builtins]
color = BRIGHT_YELLOW
words = append,cap,clear,close,complex,copy,delete,imag,len,make,max,min,new,panic,print,println,real,recover
