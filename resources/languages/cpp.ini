[language]
extensions = cpp,cxx,cc,hpp,hxx
line_comment = //
block_comment_start = /*
block_comment_end = */

[colors]
comment = GREEN
string = BRIGHT_RED
number = BRIGHT_GREEN
variable = BRIGHT_BLUE
function = BRIGHT_BLUE

[keywords.control_flow]
color = BRIGHT_MAGENTA
words = break,case,continue,default,do,else,for,goto,if,return,switch,while

[keywords.declarations]
color = BRIGHT_MAGENTA
words = auto,class,concept,consteval,constinit,constexpr,enum,extern,friend,inline,namespace,requires,static_assert,struct,template,thread_local,typedef,typename,union,using

[keywords.access_and_modifiers]
color = BRIGHT_MAGENTA
words = const,explicit,final,mutable,private,protected,public,register,override,virtual,volatile

[keywords.types]
color = BRIGHT_CYAN
words = bool,char,char8_t,char16_t,char32_t,double,float,int,long,short,signed,unsigned,void,wchar_t,size_t,ptrdiff_t,string,string_view,array,vector,deque,list,map,multimap,set,multiset,unordered_map,unordered_set,tuple,pair,optional,variant,any,unique_ptr,shared_ptr,weak_ptr

[keywords.operators]
color = BRIGHT_MAGENTA
words = alignas,alignof,and,and_eq,bitand,bitor,compl,decltype,delete,new,not,not_eq,operator,or,or_eq,sizeof,typeid,xor,xor_eq

[keywords.casts]
color = BRIGHT_MAGENTA
words = const_cast,dynamic_cast,reinterpret_cast,static_cast

[keywords.exceptions]
color = BRIGHT_MAGENTA
words = catch,noexcept,throw,try

[keywords.coroutines]
color = BRIGHT_MAGENTA
words = co_await,co_return,co_yield

[keywords.modules]
color = BRIGHT_BLUE
words = export,import,module

[keywords.object_context]
color = BRIGHT_MAGENTA
words = this

[keywords.low_level]
color = BRIGHT_CYAN
words = asm

[keywords.preprocessor]
color = BRIGHT_BLUE
words = #define,defined,#elif,#else,#endif,#error,#if,#ifdef,#ifndef,#include,#include_next,#line,#pragma,#undef,#warning

[keywords.constants]
color = BRIGHT_GREEN
words = false,nullptr,true,NULL

[keywords.standard_library]
color = BRIGHT_YELLOW
words = cin,cout,cerr,clog,endl,make_pair,make_shared,make_unique,move,forward,swap,begin,end,sort,find,lower_bound,upper_bound,min,max
