; Editor preferences

[general]
; Language pack abbreviation: zh, en, ja, ko, es, fr, ru, pt, or it.
language = en
; Positive integer in milliseconds.
ready_timeout_ms = 1000
; Enable indentation inheritance and one extra level after openers.
auto_indent = true
; Automatically insert matching brackets and quotes.
auto_pair = true
; Show automatic candidates from the current resources/languages/*.ini.
code_completion = true
; Highlight a bracket next to the cursor and its matching bracket.
bracket_matching = true
; Number of spaces inserted by Tab and used for indentation levels.
tab_width = 4

[theme]
; Values are enum color names from include/colors.h, never raw SGR numbers.
normal_text = WHITE
line_number = BRIGHT_BLACK
active_line_number = BRIGHT_WHITE
active_line_background = BG_NEAR_BLACK
tab_bar = REVERSE
tab_dropdown_background = BG_NEAR_BLACK
tab_dropdown_text = WHITE
tab_dropdown_hover_background = BG_BRIGHT_BLACK
tab_dropdown_hover_text = BRIGHT_WHITE
status_bar = REVERSE
settings_button_hover_background = BG_LIGHT_GRAY
settings_button_hover_text = WHITE
event_bar = WHITE
welcome_logo = BRIGHT_CYAN
welcome_description = BRIGHT_BLACK
welcome_shortcut = BRIGHT_YELLOW
settings_menu_background = BG_NEAR_BLACK
settings_menu_text = WHITE
settings_menu_selected_background = BG_WHITE
settings_menu_selected_text = BLACK
settings_menu_hover_background = BG_BRIGHT_BLACK
settings_menu_hover_text = BRIGHT_WHITE
completion_background = BG_NEAR_BLACK
completion_text = WHITE
completion_selected_background = BG_WHITE
completion_selected_text = BLACK
help_border = WHITE
help_title = BRIGHT_WHITE
help_section = BRIGHT_CYAN
help_key = BRIGHT_YELLOW
help_description = WHITE
help_button = BRIGHT_WHITE
help_button_hover_background = BG_WHITE
help_button_hover_text = BLACK
scrollbar_track = BG_BRIGHT_BLACK
scrollbar_thumb = BG_WHITE
selection = BG_WHITE
selection_text = BLACK
match = REVERSE
bracket_match_text = BLACK
bracket_match_background = BG_WHITE
