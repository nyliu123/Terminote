; Editor key bindings
;
; Syntax: Action = [Ctrl+][Shift+][Alt+]Key
; Ctrl, Shift, and Alt are optional. Key is required.
; Modifier order is always Ctrl, Shift, Alt, then Key.
; Every combination in this file must be unique.

[bindings]
save = Ctrl+S
save_as = Ctrl+Shift+S
open = Ctrl+O
new_file = Ctrl+N
next_tab = Ctrl+Space
run = Ctrl+E
settings = Alt+S
quit_without_saving = Ctrl+Q

cut = Ctrl+X
copy = Ctrl+C
paste = Ctrl+V
select_all = Ctrl+A
find = Ctrl+F
find_and_replace = Ctrl+R
undo = Ctrl+Z
redo = Ctrl+Shift+Z
help = Ctrl+H

cancel = Escape
placeholder = Ctrl+L
insert_newline = Enter
indent = Tab
unindent = Shift+Tab
delete_backward = Backspace
delete_forward = Delete

move_up = Up
move_down = Down
move_left = Left
move_right = Right
move_to_line_start = Home
move_to_line_end = End
page_up = PageUp
page_down = PageDown

replace_yes = Y
replace_no = N
replace_all = A
