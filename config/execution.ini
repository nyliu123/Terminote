; Commands are selected by the current file extension.
; Available placeholders:
; {file_dir}          current file folder
; {file_path}         absolute file path
; {file_stem}         absolute file path without extension
; {file_name}         file name with extension
; {file_name_no_ext}  file name without extension
; {file_ext}          extension without the dot

[commands]
c = gcc "{file_path}" -o "{file_stem}.exe" && "{file_stem}.exe" & pause
cpp = g++ "{file_path}" -o "{file_stem}.exe" && "{file_stem}.exe" & pause
cxx = g++ "{file_path}" -o "{file_stem}.exe" && "{file_stem}.exe" & pause
cc = g++ "{file_path}" -o "{file_stem}.exe" && "{file_stem}.exe" & pause
py = python "{file_path}" & pause
pyw = python "{file_path}" & pause
js = node "{file_path}" & pause
mjs = node "{file_path}" & pause
cjs = node "{file_path}" & pause
go = go run "{file_path}" & pause
rs = rustc "{file_path}" -o "{file_stem}.exe" && "{file_stem}.exe" & pause
java = javac "{file_path}" && java -cp "{file_dir}" "{file_name_no_ext}" & pause
